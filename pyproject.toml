[project]
name = "magaya-toolkit"
version = "0.1.0"
description = "Toolkit to build Magaya transactions (references, invoices) and validate their XML before submission through the Magaya API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "mrz1m3rm4n" }]
dependencies = [
    "lxml>=5.3",       # XML parsing + XSD/DTD validation
    "pydantic>=2.9",   # domain models -> validated data before serialization
    "zeep>=4.3",       # SOAP client for the Magaya API (XML Web Service over HTTP)
    "typer>=0.15",     # command-line interface
]

[project.scripts]
magaya = "magaya_toolkit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magaya_toolkit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
